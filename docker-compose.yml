services:
  backend:
    build: ./backend
    container_name: calculator-backend
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: calculator-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
